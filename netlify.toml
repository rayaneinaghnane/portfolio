# Netlify configuration for Rayane Inaghnane Portfolio

[build]
  # No build step needed for static site
  command = "echo 'Deploying portfolio...'"
  publish = "."

[dev]
  # Local development server
  command = "http-server -p 8888"
  port = 8888
  # Publish = "."

# Redirect rules
[[redirects]]
  # Redirect trailing slashes
  from = "/:path/index.html"
  to = "/:path/"
  status = 301

# Header configuration
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    
    # Performance
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Error page fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (optional)
# Uncomment to add environment variables for your site
# [context.production.environment]
#   SITE_URL = "https://example.com"
